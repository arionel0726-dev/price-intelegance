# Production reverse proxy: single public entrypoint for the web app and
# the API, so browser requests to /api/* are same-origin (no CORS, no
# cross-origin cookie concerns). Only this container's 80 (and, once TLS is
# added, 443) is published to the host - web/api/parser/postgres stay on the
# private "internal" Docker network (see docker-compose.prod.yml).
#
# This is an HTTP-only base config on purpose - this milestone is
# deployment PREPARATION, not deployment (no domain/certs yet). Adding TLS
# termination (Certbot + a 443 server block, or a companion certbot
# container) is documented as the next operational step in DEPLOYMENT.md,
# not implemented here.

upstream web_upstream {
	server web:3000;
}

upstream api_upstream {
	server api:3001;
}

server {
	listen 80;
	server_name price.vizaje-nica.com;

	client_max_body_size 10m;

	# Nest routes are NOT registered under an /api prefix internally
	# (POST /auth/login, GET /products, ...) - the trailing slash on
	# proxy_pass is what strips the /api/ prefix from the upstream request,
	# so "/api/products" reaches Nest as "/products".
	location /api/ {
		proxy_pass http://api_upstream/;

		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location / {
		proxy_pass http://web_upstream;

		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}
