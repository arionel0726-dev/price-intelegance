# Production stack: web, api, parser, postgres, nginx - one private Docker
# network, only nginx's ports published to the host. See DEPLOYMENT.md.
#
# Run with (from the repo root):
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# Variables in ${...} form come from .env.production (copy
# .env.production.example and fill in real values - never commit the real
# file). JOBVN_HOST_PATH and POSTGRES_BACKUP_HOST_PATH point at host
# directories/files that must exist before first `up`.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  parser:
    build:
      context: .
      dockerfile: services/parser/Dockerfile
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'python3', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PARSER_URL: http://parser:8000
    volumes:
      # Writable, persistent: discovery rotation cursor + operational script
      # output (full-sync-result-*.json, targeted-sync-*.json). Named volume
      # is enough for MVP - see DEPLOYMENT.md.
      - vizaje_data:/app/data/vizaje
      # Read-only: the 52MB private JobVN.json barcode-enrichment source.
      # Never baked into the image - see DEPLOYMENT.md for the expected host
      # path. This mounts a single FILE inside the vizaje_data volume's
      # directory; Docker layers file-level bind mounts over a volume mount
      # at the same parent path correctly.
      - ${JOBVN_HOST_PATH}:/app/data/vizaje/JobVN.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      parser:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'bun', '-e', "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'bun', '-e', "fetch('http://localhost:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      # - '443:443'   # add once TLS is configured - see DEPLOYMENT.md
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  vizaje_data:
